<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مشغل الفيديو الاحترافي</title>
    
    <!-- استخدام المحركات الأصيلة والمستقرة Dash.js و Hls.js لضمان تخطي حظر MBC و EdgeNext ومشاكل الـ CORS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --plyr-color-main: rgba(255, 255, 255, 0.4) !important;
        }

        .plyr--full-ui input[type=range] { color: #fff !important; }
        .plyr__control--overlaid { background: rgba(255, 255, 255, 0.15) !important; }
        .plyr--video .plyr__control.plyr__tab-focus, 
        .plyr--video .plyr__control:hover, 
        .plyr--video .plyr__control[aria-expanded=true] {
            background: rgba(255, 255, 255, 0.2) !important;
            color: #fff !important;
        }

        .plyr__menu__container {
            background: rgba(255, 255, 255, 0.12) !important;
            backdrop-filter: blur(15px) !important;
            -webkit-backdrop-filter: blur(15px) !important;
            border: none !important;
            color: #fff !important;
        }
        .plyr__menu__container .plyr__control { color: #fff !important; }
        .plyr__menu__container [role="menuitemradio"][aria-checked="true"]::before { background: #fff !important; }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            padding: 0 !important; /* ملء كامل الشاشة وإخفاء أي حواف سوداء */
        }

        .video-player-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .plyr, .plyr--video {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            background: #000 !important;
        }

        .plyr__video-wrapper {
            width: 100% !important;
            height: 100% !important;
        }
        
        .plyr.mode-contain .plyr__video-wrapper video { 
            object-fit: contain !important; 
            width: 100% !important; 
            height: 100% !important; 
        }
        .plyr.mode-cover .plyr__video-wrapper video { 
            object-fit: cover !important; 
            width: 100% !important; 
            height: 100% !important; 
        }
        .plyr.mode-fill .plyr__video-wrapper video { 
            object-fit: fill !important; 
            width: 100% !important; 
            height: 100% !important; 
        }
        .plyr.mode-original .plyr__video-wrapper video { 
            object-fit: none !important; 
            width: auto !important; 
            height: auto !important; 
            max-width: 100% !important; 
            max-height: 100% !important; 
        }

        /* كود إخفاء عناصر التحكم كلياً عند الدخول بوضع صورة داخل صورة PiP */
        .plyr--pip-active .plyr__controls, 
        .plyr--pip-active .plyr__title {
            display: none !important;
        }

        .plyr__title {
            position: absolute;
            bottom: calc(48px + 16px);
            left: 20px;
            z-index: 12;
            font-size: 15px !important;
            color: #fff !important;
            background: rgba(255, 255, 255, 0.12) !important;
            border-radius: 4px !important;
            padding: 6px 14px !important;
            height: 34px !important;
            line-height: 34px !important;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .plyr--controls-visible .plyr__title {
            opacity: 1 !important;
            visibility: visible !important;
            transform: translateY(0);
        }

        .plyr__playlist {
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: calc(48px + 16px + 34px + 16px);
            z-index: 20;
            transform: translateY(20px) scale(0.98);
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            pointer-events: none;
        }

        .plyr--controls-visible.playlist-open .plyr__playlist {
            transform: translateY(0) scale(1);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .playlist-wrapper {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .playlist-wrapper::-webkit-scrollbar { display: none; }

        .playlist-item {
            flex: 0 0 auto;
            width: 240px;
            height: 135px;
            color: #fff !important;
            background: rgba(255, 255, 255, 0.12) !important;
            border-radius: 4px !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            cursor: pointer;
        }
        .playlist-item.active { background: rgba(255, 255, 255, 0.25) !important; }

        .plyr__controls {
            background: transparent !important;
            padding: 0 20px 10px !important;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="video-player-container">
        <!-- تصفير الحاوية ديناميكياً لتحديث الجودات -->
    </div>

    <script>
        // الخدعة البرمجية (Polyfill) المتقدمة لتخطي قيود القراءة فقط في المتصفح وإجبار Plyr على إظهار زر الـ PiP الأصلي للمشغل بكامل ثيمه [1.2]
        Object.defineProperty(document, 'pictureInPictureEnabled', {
            get: function() { return true; },
            configurable: true
        });

        HTMLVideoElement.prototype.requestPictureInPicture = async function() {
            if (window.AndroidBridge && typeof window.AndroidBridge.enterPip === 'function') {
                window.AndroidBridge.enterPip();
            }
            return {};
        };

        document.exitPictureInPicture = async function() {
            return {};
        };

        let shakaPlayer = null;
        let plyrPlayer = null;
        let hlsInstance = null;
        let dashInstance = null;

        let playerContainer = null;
        let videoElement = null;
        let titleElement = null;
        let playlistElement = null;

        let isPlaylistOpen = false;
        
        // الأوضاع الأربعة لتغيير الأبعاد مع تعيين وضع Stretch / Fill ليعمل افتراضياً دائماً
        const modes = ['mode-contain', 'mode-cover', 'mode-fill', 'mode-original'];
        let currentMode = 2; // البعد الافتراضي الدائم للمشغل هو Stretch / Fill

        let currentPlaylist = [
            { title: "Video #01", src: "https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-720p.mp4" },
            { title: "Video #02", src: "https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-1080p.mp4" }
        ];
        let currentSrc = currentPlaylist[0].src;
        let currentTitle = currentPlaylist[0].title;
        let currentIndex = 0; // تتبع الفهرس لضمان ثبات العنصر النشط بالـ Playlist بدقة

        // فحص ذكي وتلقائي لتحديد هل الرابط يحتاج استخراج بالخلفية أم هو رابط بث مباشر [2.1, 2.2]
        function isExtractionTarget(url) {
            if (url.includes('##ex')) return true;
            const cleanUrl = url.split('###')[0].split('?')[0].toLowerCase();
            // الفحص التلقائي لروابط فاصل إعلاني في الـ Playlist بدون وجود وسم يدوياً لكل رابط
            if (cleanUrl.includes('fasel') && !cleanUrl.endsWith('.m3u8') && !cleanUrl.endsWith('.mpd') && !cleanUrl.endsWith('.mp4')) {
                return true;
            }
            return false;
        }

        // تحويل مفاتيح DRM من Base64 إلى Hex
        function base64ToHex(str) {
            let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4 !== 0) b64 += '=';
            const raw = window.atob(b64);
            let hex = '';
            for (let i = 0; i < raw.length; i++) {
                let h = raw.charCodeAt(i).toString(16);
                if (h.length === 1) h = '0' + h;
                hex += h;
            }
            return hex;
        }

        async function loadStream(url) {
            // إيقاف وكتم أي فيديو يعمل بالخلفية فوراً لمنع تسريب الصوت
            if (videoElement) {
                videoElement.pause();
                videoElement.src = "";
                try { videoElement.load(); } catch(e){}
            }
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            if (dashInstance) { dashInstance.destroy(); dashInstance = null; }
            if (plyrPlayer) { plyrPlayer.destroy(); plyrPlayer = null; }

            // تفعيل التحليل الذكي للرابط وتوجيهه لخادوم الاستخراج بالخلفية
            if (isExtractionTarget(url)) {
                const cleanUrl = url.split('##ex')[0].trim();
                if (window.AndroidBridge && typeof window.AndroidBridge.triggerExtraction === 'function') {
                    window.AndroidBridge.triggerExtraction(cleanUrl);
                }
                return;
            }

            const container = document.querySelector('.video-player-container');
            container.innerHTML = '<video id="player" controls crossorigin playsinline autoplay></video>';
            videoElement = document.getElementById('player');

            const hasDRM = url.includes('###');
            const manifestUri = hasDRM ? url.split('###')[0].trim() : url;

            const isHls = manifestUri.includes('.m3u8');
            const isDash = manifestUri.includes('.mpd');

            if (isHls) {
                // تفعيل التخزين المسبق الممتد لـ دقيقة كاملة (60 ثانية) لتجنب انقطاع البث
                const hls = new Hls({
                    maxBufferLength: 60,       // تخزين 60 ثانية مسبقاً لمقاومة تقلب الإنترنت [5.1]
                    maxMaxBufferLength: 60,
                    lowLatencyMode: true       // تقليل وقت التأخير لبدء التشغيل الفوري
                });
                hlsInstance = hls;
                hls.loadSource(manifestUri);
                hls.attachMedia(videoElement);

                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    const availableQualities = hls.levels.map((l) => l.height).filter((h, i, arr) => arr.indexOf(h) === i && h > 0);
                    availableQualities.sort((a, b) => b - a);
                    const qualities = [0, ...availableQualities];

                    plyrPlayer = new Plyr(videoElement, {
                        controls: ['rewind', 'play', 'fast-forward', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'],
                        quality: {
                            default: 0,
                            options: qualities,
                            forced: true,
                            onChange: (q) => {
                                if (q === 0) {
                                    hls.currentLevel = -1; // Auto
                                } else {
                                    hls.levels.forEach((level, idx) => {
                                        if (level.height === q) { hls.currentLevel = idx; }
                                    });
                                }
                            }
                        },
                        i18n: { qualityLabel: { 0: 'Auto' } },
                        settings: ['quality', 'speed', 'captions']
                    });
                    initCustomUI(plyrPlayer);
                });

            } else if (isDash) {
                const dash = dashjs.MediaPlayer().create();
                dashInstance = dash;

                // حقن وتفعيل مفاتيح فك تشفير الـ ClearKey DRM الأصلية لـ Dash.js دون حظر [5.2]
                if (hasDRM) {
                    const keyParts = url.split('###')[1].split(':');
                    const keyIdHex = base64ToHex(keyParts[0].trim());
                    const keyHex = base64ToHex(keyParts[1].trim());

                    dash.setProtectionData({
                        "org.w3.clearkey": {
                            "clearkeys": {
                                [keyIdHex]: keyHex
                            }
                        }
                    });
                }

                dash.initialize(videoElement, manifestUri, true);

                // ميزة التخزين المسبق لـ دقيقة كاملة (60 ثانية) لتجنب انقطاع البث في Dash.js [5.2]
                dash.updateSettings({
                    streaming: {
                        buffer: {
                            stableBufferTime: 60, // البقاء بـ بفر آمن مدته 60 ثانية بالخلفية
                            bufferTimeAtTopQuality: 60
                        },
                        abr: {
                            autoSwitchBitrate: { video: true }
                        }
                    }
                });

                dash.on("streamInitialized", function () {
                    const bitrateList = dash.getBitrateInfoListFor("video");
                    const qualitiesMap = new Map();
                    bitrateList.forEach(info => {
                        if (!qualitiesMap.has(info.height) || qualitiesMap.get(info.height).bitrate < info.bitrate) {
                            qualitiesMap.set(info.height, info);
                        }
                    });

                    const resolutionsSorted = Array.from(qualitiesMap.keys()).sort((a, b) => b - a);
                    const qualities = [0, ...resolutionsSorted];

                    plyrPlayer = new Plyr(videoElement, {
                        controls: ['rewind', 'play', 'fast-forward', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'],
                        quality: {
                            default: 0,
                            options: qualities,
                            forced: true,
                            onChange: (q) => {
                                if (q === 0) {
                                    dash.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: true } } } });
                                } else {
                                    dash.updateSettings({ streaming: { abr: { autoSwitchBitrate: { video: false } } } });
                                    const targetIdx = qualitiesMap.get(q).qualityIndex;
                                    dash.setQualityFor("video", targetIdx, true);
                                }
                            }
                        },
                        i18n: { qualityLabel: { 0: 'Auto' } },
                        settings: ['quality', 'speed', 'captions']
                    });
                    initCustomUI(plyrPlayer);
                });

            } else {
                videoElement.src = manifestUri;
                plyrPlayer = new Plyr(videoElement, {
                    controls: ['rewind', 'play', 'fast-forward', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'],
                    seekTime: 10,
                    settings: ['speed', 'captions'],
                    fullscreen: { iosNative: true, video: true, container: '.plyr' },
                    hideControls: true,
                    clickToPlay: false
                });
                initCustomUI(plyrPlayer);
            }
        }

        function initCustomUI(playerInstance) {
            playerContainer = videoElement.closest('.plyr');

            // تأجيل عمليات تطويع الأزرار لتحدث داخل حدث الجاهزية لـ Plyr لضمان ظهور زر Fullscreen وزر PiP الأصلي [1.2]
            playerInstance.on('ready', () => {
                playerContainer.classList.add(modes[currentMode]);

                // استنساخ وزر الـ Fullscreen وتطويعه للدوران بين أبعاد العرض الأربعة
                const fsBtn = playerContainer.querySelector('[data-plyr="fullscreen"]');
                if (fsBtn) {
                    const newFsBtn = fsBtn.cloneNode(true);
                    fsBtn.parentNode.replaceChild(newFsBtn, fsBtn);

                    newFsBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();

                        playerContainer.classList.remove(modes[currentMode]);
                        currentMode = (currentMode + 1) % modes.length;
                        playerContainer.classList.add(modes[currentMode]);

                        const labelMap = {
                            'mode-contain': 'Contain',
                            'mode-cover': 'Cover',
                            'mode-fill': 'Stretch / Fill',
                            'mode-original': 'Original Size'
                        };
                        newFsBtn.setAttribute('aria-label', labelMap[modes[currentMode]]);
                    });
                }
            });

            const oldTitle = playerContainer.querySelector('.plyr__title');
            if (oldTitle) oldTitle.remove();
            const oldPlaylist = playerContainer.querySelector('.plyr__playlist');
            if (oldPlaylist) oldPlaylist.remove();

            titleElement = document.createElement('div');
            titleElement.className = 'plyr__title';
            titleElement.innerHTML = currentTitle + ' <span>👍</span>';
            playerContainer.appendChild(titleElement);

            playlistElement = document.createElement('div');
            playlistElement.className = 'plyr__playlist';
            playlistElement.innerHTML = `
                <div class="playlist-wrapper">
                    ${currentPlaylist.map((video, idx) => `
                        <div class="playlist-item${idx === currentIndex ? ' active' : ''}" data-src="${video.src}">${video.title}</div>
                    `).join('')}
                </div>
            `;
            playerContainer.appendChild(playlistElement);

            const playlistItems = playlistElement.querySelectorAll('.playlist-item');
            playlistItems.forEach((item, idx) => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    currentIndex = idx; // تتبع العنصر النشط رقمياً لثبات قائمة التشغيل
                    currentSrc = item.getAttribute('data-src');
                    currentTitle = item.textContent;
                    loadStream(currentSrc);
                });
            });

            titleElement.addEventListener('click', (e) => {
                e.stopPropagation();
                isPlaylistOpen = !isPlaylistOpen;
                playerContainer.classList.toggle('playlist-open', isPlaylistOpen);
            });

            playerInstance.on('controlsshown', () => playerContainer.classList.add('plyr--controls-visible'));
            playerInstance.on('controlshidden', () => {
                playerContainer.classList.remove('plyr--controls-visible');
                playerContainer.classList.remove('playlist-open');
                isPlaylistOpen = false;
            });

            playerInstance.on('ready', () => {
                playerInstance.play();
                // فرض معدل السرعة الطبيعي دائماً فور جاهزية البث
                playerInstance.speed = 1.0; 
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const isDeeplink = urlParams.get('deeplink') === 'true';
            
            if (!isDeeplink) {
                loadStream(currentSrc); 
            }
        });

        // دوال وهمية للمحافظة على التوافق مع نداءات الكوتلن دون إطلاق أي واجهة سوداء للاستخراج الصامت
        window.showLoadingLoop = function() {};
        window.hideLoadingLoop = function() {};

        window.playExtractedUrl = function(url) {
            loadStream(url);
        };

        window.loadBase64Playlist = function(base64Str) {
            try {
                var binaryString = atob(base64Str);
                var percentEscaped = binaryString.split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join('');
                var jsonStr = decodeURIComponent(percentEscaped);
                var playlistData = JSON.parse(jsonStr);

                if (playlistData && playlistData.length > 0) {
                    currentIndex = 0; // البدء بالفيديو الأول افتراضياً
                    currentPlaylist = playlistData;
                    currentSrc = playlistData[0].src;
                    currentTitle = playlistData[0].title;
                    loadStream(currentSrc);
                }
            } catch (e) {
                console.error("Error loading playlist:", e);
            }
        };
    </script>
</body>
</html>
